name: Tests and Coverage

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]
  schedule:
    # Executa todo dia às 6:00 UTC
    - cron: '0 6 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        uv sync --dev

    - name: Lint with ruff
      run: |
        uv run ruff check sicoob/
        uv run ruff format sicoob/ --check

    - name: Run unit tests with coverage
      run: |
        uv run pytest \
          -m "not integration and not slow" \
          --cov=sicoob \
          --cov-branch \
          --cov-report=xml \
          --cov-report=html \
          --cov-report=term-missing \
          --junit-xml=junit.xml \
          --cov-fail-under=80

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: true

    - name: Upload coverage to Codacy
      uses: codacy/codacy-coverage-reporter-action@v1
      if: matrix.python-version == '3.10'
      with:
        project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
        coverage-reports: coverage.xml

    - name: Archive coverage reports
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-${{ matrix.python-version }}
        path: |
          htmlcov/
          coverage.xml
          junit.xml

    - name: Comment coverage on PR
      if: github.event_name == 'pull_request' && matrix.python-version == '3.10'
      uses: py-cov-action/python-coverage-comment-action@v3
      with:
        GITHUB_TOKEN: ${{ github.token }}
        MINIMUM_GREEN: 90
        MINIMUM_ORANGE: 80

  integration-tests:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: uv sync --dev

    - name: Run integration tests
      env:
        SICOOB_CLIENT_ID: ${{ secrets.SICOOB_CLIENT_ID }}
        SICOOB_SANDBOX_CLIENT_ID: ${{ secrets.SICOOB_SANDBOX_CLIENT_ID }}
      run: |
        uv run pytest \
          -m "integration" \
          --cov=sicoob \
          --cov-append \
          --cov-report=xml \
          --cov-report=html \
          --junit-xml=junit-integration.xml \
          --maxfail=3 \
          -v
      continue-on-error: true

    - name: Upload integration test results
      uses: actions/upload-artifact@v4
      with:
        name: integration-test-results
        path: |
          htmlcov/
          coverage.xml
          junit-integration.xml

  coverage-report:
    runs-on: ubuntu-latest
    needs: [test, integration-tests]
    if: always()

    steps:
    - uses: actions/checkout@v4

    - name: Download all coverage reports
      uses: actions/download-artifact@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: uv sync --dev

    - name: Combine coverage reports
      run: |
        # Combine coverage from different Python versions
        find . -name "coverage.xml" -exec echo "Found coverage file: {}" \;
        
        # Generate combined report
        uv run coverage combine || echo "No .coverage files to combine"
        uv run coverage report --format=markdown > coverage-summary.md
        uv run coverage json

    - name: Generate coverage badge
      run: |
        pip install genbadge[coverage]
        genbadge coverage -i coverage.xml -o coverage-badge.svg || echo "Badge generation failed"

    - name: Coverage summary
      run: |
        echo "## Coverage Summary" >> $GITHUB_STEP_SUMMARY
        cat coverage-summary.md >> $GITHUB_STEP_SUMMARY || echo "No coverage summary available"
        
        # Extract total coverage
        TOTAL_COV=$(python -c "
        try:
            import json
            with open('coverage.json') as f:
                data = json.load(f)
                print(f'{data[\"totals\"][\"percent_covered\"]:.1f}%')
        except:
            print('N/A')
        ")
        
        echo "**Total Coverage: $TOTAL_COV**" >> $GITHUB_STEP_SUMMARY

    - name: Upload final coverage report
      uses: actions/upload-artifact@v4
      with:
        name: final-coverage-report
        path: |
          coverage-summary.md
          coverage.json
          coverage-badge.svg

  security-scan:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v3

    - name: Security scan with bandit
      run: |
        uv run pip install bandit[toml]
        uv run bandit -r sicoob/ -f json -o bandit-report.json || true
        uv run bandit -r sicoob/ || true

    - name: Upload security scan results
      uses: actions/upload-artifact@v4
      with:
        name: security-scan
        path: bandit-report.json