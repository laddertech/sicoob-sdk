name: Tests and Coverage

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Executa todo dia às 6:00 UTC
    - cron: '0 6 * * *'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
      with:
        version: "0.7.8"

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        uv sync --dev

    - name: Lint with ruff
      run: |
        uv run ruff check sicoob/
        uv run ruff format sicoob/ --check

    - name: Run unit tests with coverage
      run: |
        uv run pytest \
          -m "not integration and not slow" \
          --cov=sicoob \
          --cov-branch \
          --cov-report=xml \
          --cov-report=html \
          --cov-report=term-missing \
          --junit-xml=junit.xml \
          --cov-fail-under=80

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}
      continue-on-error: true

    - name: Upload coverage to Codacy
      uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1
      if: matrix.python-version == '3.10'
      with:
        project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
        coverage-reports: coverage.xml
      continue-on-error: true

    - name: Archive coverage reports
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: coverage-report-${{ matrix.python-version }}
        path: |
          htmlcov/
          coverage.xml
          junit.xml


  integration-tests:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    needs: test

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
      with:
        version: "0.7.8"

    - name: Set up Python 3.10
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: uv sync --dev

    - name: Run integration tests
      env:
        SICOOB_CLIENT_ID: ${{ secrets.SICOOB_CLIENT_ID }}
        SICOOB_SANDBOX_CLIENT_ID: ${{ secrets.SICOOB_SANDBOX_CLIENT_ID }}
      run: |
        uv run pytest \
          -m "integration" \
          --cov=sicoob \
          --cov-append \
          --cov-report=xml \
          --cov-report=html \
          --junit-xml=junit-integration.xml \
          --maxfail=3 \
          -v
      continue-on-error: true

    - name: Upload integration test results
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: integration-test-results
        path: |
          htmlcov/
          coverage.xml
          junit-integration.xml

  coverage-report:
    runs-on: ubuntu-latest
    needs: [test, integration-tests]
    if: always()
    continue-on-error: true

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false

    - name: Download all coverage reports
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4

    - name: Install uv
      uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
      with:
        version: "0.7.8"

    - name: Set up Python 3.10
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: uv sync --dev

    - name: Combine coverage reports
      run: |
        # Combine coverage from different Python versions
        find . -name "coverage.xml" -exec echo "Found coverage file: {}" \;

        # Generate combined report - continue even if combine fails
        uv run coverage combine || echo "No .coverage files to combine"
        uv run coverage report --format=markdown > coverage-summary.md || echo "No coverage data available" > coverage-summary.md
        uv run coverage json || echo '{"totals": {"percent_covered": 0}}' > coverage.json
      continue-on-error: true

    - name: Generate coverage badge
      run: |
        pip install 'genbadge[coverage]==1.1.2'
        # Find any coverage.xml file to use for badge generation
        COVERAGE_FILE=$(find . -name "coverage.xml" | head -1)
        if [ -n "$COVERAGE_FILE" ]; then
          genbadge coverage -i "$COVERAGE_FILE" -o coverage-badge.svg || echo "Badge generation failed"
        else
          echo "No coverage.xml file found for badge generation"
        fi
      continue-on-error: true

    - name: Coverage summary
      run: |
        echo "## Coverage Summary" >> $GITHUB_STEP_SUMMARY
        if [ -f "coverage-summary.md" ]; then
          cat coverage-summary.md >> $GITHUB_STEP_SUMMARY
        else
          echo "No coverage summary available" >> $GITHUB_STEP_SUMMARY
        fi

        # Extract total coverage
        TOTAL_COV=$(python -c "
        try:
            import json
            with open('coverage.json') as f:
                data = json.load(f)
                print(f'{data[\"totals\"][\"percent_covered\"]:.1f}%')
        except:
            print('N/A')
        ")

        echo "**Total Coverage: $TOTAL_COV**" >> $GITHUB_STEP_SUMMARY
      continue-on-error: true

    - name: Upload final coverage report
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: final-coverage-report
        path: |
          coverage-summary.md
          coverage.json
          coverage-badge.svg

  security-scan:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
      with:
        version: "0.7.8"

    - name: Security scan with bandit
      run: |
        uv run pip install bandit[toml]
        uv run bandit -r sicoob/ -f json -o bandit-report.json || true
        uv run bandit -r sicoob/ || true

    - name: Upload security scan results
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: security-scan
        path: bandit-report.json
